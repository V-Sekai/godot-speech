name: 🧪 Godot-free CI

# Build verification for the Godot-engine-independent test trees:
#   * tests/slang_validate/  — Lean-formalized kernels + slangc-cpp + bit-exact CPU validators
#   * tests/godot_audio_model/  — CMake-built stand-in for Godot's audio API, with the verbatim macOS CoreAudio driver
#
# Neither tree links against godot-cpp or the Godot engine; this
# workflow exists precisely to keep them buildable on every PR
# touching speech*, lean/, tests/slang_validate/, or
# tests/godot_audio_model/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  slang_validate:
    name: Slang validators (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Lean 4 toolchain via elan. We pin in lean/lean-toolchain
      # (currently leanprover/lean4:v4.29.1); elan reads it from cwd.
      - name: Install elan + Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: |
            lean/.lake
            ~/.elan/toolchains
          key: lake-${{ matrix.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}

      - name: Build Lean tree (native_decide pins)
        working-directory: lean
        run: lake build Speech emit_shaders

      - name: Install slangc (pinned)
        env:
          SLANG_HOME: ${{ runner.temp }}/slang
        run: |
          bash misc/install-slang.sh "$SLANG_HOME"
          echo "SLANG_HOME=$SLANG_HOME" >> "$GITHUB_ENV"
          echo "$SLANG_HOME/bin" >> "$GITHUB_PATH"

      - name: Run slang validators (cpp target — bit-exact)
        working-directory: tests/slang_validate
        run: SLANGC="$SLANG_HOME/bin/slangc" make test-cpp

      - name: Run slang validators (metal target — discipline)
        if: runner.os == 'macOS'
        working-directory: tests/slang_validate
        run: SLANGC="$SLANG_HOME/bin/slangc" make metal-discipline

  net_loopback:
    name: net_loopback (FTXUI vendor, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install cmake + ninja + opus + libsamplerate
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build libopus-dev libsamplerate0-dev pkg-config
          else
            brew install cmake ninja opus libsamplerate pkg-config
          fi
        shell: bash

      - name: Configure (FetchContent fetches FTXUI v6.1.9)
        working-directory: tests/net_loopback
        run: cmake -S . -B build -G Ninja

      - name: Build
        working-directory: tests/net_loopback
        run: cmake --build build

      - name: Hello smoke (FTXUI link + render)
        working-directory: tests/net_loopback
        run: ./build/net_loopback_hello

      - name: Loopback driver (sender -> middleware -> receiver)
        working-directory: tests/net_loopback
        run: ./build/net_loopback_driver

      - name: Dashboard render smoke (FTXUI layout)
        working-directory: tests/net_loopback
        run: ./build/net_loopback_dashboard_smoke

      - name: Observer (live loopback + kernel ⇔ engine markers)
        working-directory: tests/net_loopback
        run: ./build/net_loopback_observer

  audio_model_macos:
    name: Audio model (macOS, CoreAudio)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install opus + libsamplerate
        run: brew install opus libsamplerate pkg-config

      - name: Configure CMake
        working-directory: tests/godot_audio_model
        run: cmake -S . -B build -G "Unix Makefiles"

      - name: Build
        working-directory: tests/godot_audio_model
        run: cmake --build build --parallel

      - name: Smoke test (model)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_smoke

      - name: Smoke test (decoder linked against model)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_decoder_smoke

      - name: Smoke test (processor encode -> decode round-trip)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_processor_smoke

      - name: Smoke test (full Speech node — pass 7c)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_speech_smoke

      - name: End-to-end integration (capture -> encode -> receive)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_integration

      - name: Kernel ⇔ runtime agreement (slang_validate ⇔ engine)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_agreement

  audio_model_linux:
    name: Audio model (Linux, no CoreAudio)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install opus + libsamplerate
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev libsamplerate0-dev pkg-config cmake ninja-build

      - name: Configure CMake
        working-directory: tests/godot_audio_model
        run: cmake -S . -B build -G Ninja

      - name: Build (no CoreAudio driver on Linux; speech_engine still builds)
        working-directory: tests/godot_audio_model
        run: cmake --build build

      - name: Smoke test (model)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_smoke

      - name: Smoke test (decoder linked against model)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_decoder_smoke

      - name: Smoke test (processor encode -> decode round-trip)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_processor_smoke

      - name: Smoke test (full Speech node — pass 7c)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_speech_smoke

      - name: End-to-end integration (capture -> encode -> receive)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_integration

      - name: Kernel ⇔ runtime agreement (slang_validate ⇔ engine)
        working-directory: tests/godot_audio_model
        run: ./build/godot_audio_model_agreement

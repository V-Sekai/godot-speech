name: 📊 Static Checks
on: [push, pull_request]

jobs:
  static-checks:
    name: Formatting (clang-format, file format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -qq \
            dos2unix recode clang-format

      - name: File formatting checks (file_format.sh)
        run: |
          bash ./.github/workflows/scripts/file_format.sh

      - name: Style checks via clang-format (clang_format.sh)
        run: |
          bash ./.github/workflows/scripts/clang_format.sh
